[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sumx"
version = "0.2.11"
description = "A small xBase-inspired interpreter using SQLite and sumTUI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = ["sumui>=0.1.0a5", "sumtui>=0.8.0a6", "sumide>=0.2.11", "rich>=13.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

[project.optional-dependencies]
gui = ["sumgui>=0.2.0a7"]

[project.scripts]
sumx = "sumx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumx*"]

[tool.setuptools.package-data]
sumx = ["help.md", "help.helpdb"]
